# Grid-aligned slip flow (Shrinath et al. 2023, Sec 6.3.1; Maruthi & Rao 2015, Sec 3.5.1)
# Mach 2 stream slips under a Mach 3 stream at equal pressure/density.
# Generated by ns::config::to_toml -- canonical schema

[case]
name = "SlipFlow"
equations = "euler"
formulation = "nondimensional"
flow = "steady"

[grid]
file = "SlipFlowGrid2020.dat"
nx = 20
ny = 20
scaling = 1.0

[numerics]
inviscid_scheme = "nkfds-movers-2o"
order = "second"
time_method = "forward-euler"
cfl = 0.4
viscous_method = "green-gauss"

[physics]
Re_inf = 257354.0
Mach_inf = 2.0
alpha_deg = 0.0
p_inf = 0.0
T_inf = 0.0
reference_length = 1.0

[physics.reference_state]
pressure = 1e+05
temperature = 300.0
density = 1.12
velocity = 1.0

[run]
max_iterations = 5000
total_time = 4.0

[output]
directory = "output/slip_flow"
display_frequency = 500
write_frequency = 5000
formats = ["solution", "vtk", "residual"]

# lower half of left boundary: Mach 2 freestream (ND: u*=M, p*=1/gamma)
[[boundary]]
edge = "imin"
start = 2
end = 12
type = "prescribed-inflow"
state = [1.0, 2.0, 0.0, 0.7142857142857143]

# upper half of left boundary: Mach 3 stream
[[boundary]]
edge = "imin"
start = 13
end = 21
type = "prescribed-inflow"
state = [1.0, 3.0, 0.0, 0.7142857142857143]

[[boundary]]
edge = "imax"
start = 2
end = 21
type = "transmissive"

[[boundary]]
edge = "jmax"
start = 2
end = 21
type = "transmissive"

[[boundary]]
edge = "jmin"
start = 2
end = 21
type = "transmissive"
