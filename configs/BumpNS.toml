# Supersonic viscous flow over a 4% circular-arc bump
# (Shrinath et al. 2023, Sec 6.4.2; channel [-1,2]x[0,1], M=1.4, Re=8000)
# Generated by ns::config::to_toml -- canonical schema

[case]
name = "BumpNS"
equations = "navier-stokes"
formulation = "nondimensional"
flow = "steady"

[grid]
file = "BumpGrid24080.dat"
nx = 240
ny = 80
scaling = 1.0

[numerics]
inviscid_scheme = "roe-2o"
order = "second"
time_method = "forward-euler"
cfl = 0.25
viscous_method = "green-gauss"

[physics]
Re_inf = 8000.0
Mach_inf = 1.4
alpha_deg = 0.0
p_inf = 0.0
T_inf = 0.0
reference_length = 1.0

[physics.reference_state]
pressure = 1e+05
temperature = 300.0
density = 1.12
velocity = 1.0

[run]
max_iterations = 60000
total_time = 4.0

[output]
directory = "output/bump_ns"
display_frequency = 2000
write_frequency = 30000
formats = ["solution", "vtk", "residual"]

# left: supersonic inlet (farfield uses internal freestream M=1.4)
[[boundary]]
edge = "imin"
start = 2
end = 81
type = "farfield"

# right: supersonic outflow
[[boundary]]
edge = "imax"
start = 2
end = 81
type = "transmissive"

# top: inviscid (slip) wall
[[boundary]]
edge = "jmax"
start = 2
end = 241
type = "slip-wall"

# bottom: symmetry upstream of bump (x in [-1,0]), viscous wall from x=0 on
[[boundary]]
edge = "jmin"
start = 2
end = 81
type = "symmetry"

[[boundary]]
edge = "jmin"
start = 82
end = 241
type = "no-slip-adiabatic-wall"
